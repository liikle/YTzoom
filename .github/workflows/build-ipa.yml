name: IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: YouTube IPA URL (iOS 16 base, 21.33.6)
        required: true
        default: "https://www.dropbox.com/scl/fi/1m7rq3lpkg3mfsone2299/com.google.ios.youtube-21.33.6-eeveedecrypter.ipa?rlkey=b2nsvre89881puprynwkfau8q&st=4fkh7ry8&dl=1"
        type: string
      ipa_url_ios17:
        description: Second YouTube IPA URL (iOS 17+ base, 21.41.5). Leave empty to build one IPA.
        required: false
        default: "https://www.dropbox.com/scl/fi/a937ul1u0s72xri2e2m3i/com.google.ios.youtube-21.41.5-eeveedecrypter.ipa?rlkey=ycya2apwz7fs1x1w3ua8y0mcu&st=nyvrtfpy&dl=1"
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-deb.yml

  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Collect IPA bases
        id: targets
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          IPA_URL_IOS17: ${{ inputs.ipa_url_ios17 }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          targets = [{"label": "ios16", "url": os.environ["IPA_URL"]}]
          second = os.environ.get("IPA_URL_IOS17", "").strip()
          if second:
              targets.append({"label": "ios17", "url": second})
          print("targets=" + json.dumps(targets))
          PY

  package:
    needs: [build, plan]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: YTzoom-deb-rootless
          path: packages

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Setup
        run: brew install ldid dpkg

      - name: YouTube
        env:
          IPA_URL: ${{ matrix.target.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl --fail --location \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$IPA_URL" --output YouTube.ipa
          else
            curl --fail --location "$IPA_URL" --output YouTube.ipa
          fi
          file_type=$(file --mime-type -b YouTube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            exit 1
          fi

      - name: Recon
        if: matrix.target.label == 'ios17'
        run: |
          set +e
          mkdir rc && cd rc && unzip -q ../YouTube.ipa
          APP=$(ls -d Payload/*.app)
          echo "APP=$APP"
          ls "$APP" | head -50
          ls "$APP/Frameworks" | head -80
          python3 - "$APP" <<'PY'
          import os, re, sys
          app = sys.argv[1]
          pat = re.compile(rb'[\x20-\x7e]{4,200}')
          seen = set()
          files = 0
          with open('all.txt', 'w') as out:
              for root, dirs, names in os.walk(app):
                  for name in names:
                      path = os.path.join(root, name)
                      try:
                          with open(path, 'rb') as f:
                              head = f.read(4)
                              if head not in (b'\xcf\xfa\xed\xfe', b'\xca\xfe\xba\xbe'):
                                  continue
                              data = head + f.read()
                      except OSError:
                          continue
                      files += 1
                      for m in pat.findall(data):
                          if m not in seen:
                              seen.add(m)
                              out.write(m.decode('ascii') + '\n')
          print('macho files', files, 'unique strings', len(seen))
          PY
          wc -l all.txt
          echo "=== AV USAGE ==="
          for w in AVCaptureMovieFileOutput AVAssetWriterInputPixelBufferAdaptor AVAssetWriter AVCaptureVideoDataOutput AVCaptureVideoPreviewLayer AVCaptureMultiCamSession AVCaptureDeviceDiscoverySession AVCaptureDeviceTypeBuiltInDualWideCamera AVCaptureDeviceTypeBuiltInTripleCamera AVCaptureDeviceTypeBuiltInUltraWideCamera videoZoomFactor rampToVideoZoomFactor:withRate: setActiveVideoMinFrameDuration: preferredVideoStabilizationMode setVideoSettings: setSampleBufferDelegate:queue: captureOutput:didOutputSampleBuffer:fromConnection: appendPixelBuffer:withPresentationTime: appendSampleBuffer: startSessionAtSourceTime: startRecordingToOutputFileURL:recordingDelegate: MTKView CAMetalLayer AVSampleBufferDisplayLayer; do
            printf '%s %s\n' "$(grep -c -- "$w" all.txt)" "$w"
          done
          echo "=== CAMERA CLASSES ==="
          grep -E '^[A-Z][A-Za-z0-9_]{3,80}$' all.txt | grep -E '(Camera|Capture|Recorder|Recording|Shutter|RecordButton|Ghost|Align|Onion|Lens|Segment)' | grep -vE '^(AV|CM|CV|UI|NS|CA|MTL|CI|GLK|SCN|AR|PH|GTM|FIR|GPB)' | sort -u | head -300
          echo "=== CAMERA SELECTORS ==="
          grep -E '^[a-z][A-Za-z0-9_:]{6,120}$' all.txt | grep -E '(startRecording|stopRecording|pauseRecording|resumeRecording|didStartRecording|didStopRecording|didFinishRecording|recordButton|segment[A-Z]|Segment|isRecording|alignment|ghostImage|onionSkin)' | sort -u | head -250
          echo "=== SHORTS CLASSES ==="
          grep -E '^[A-Z][A-Za-z0-9_]{3,80}$' all.txt | grep -E 'Shorts' | grep -E '(Creat|Camera|Edit|Upload|Record|Post|Metadata|Comment|Rail|Timeline|Segment)' | sort -u | head -300
          echo "=== UPLOAD / COMMENT CLASSES ==="
          grep -E '^[A-Z][A-Za-z0-9_]{3,80}$' all.txt | grep -E '(Upload|Moderation|CommentSetting|CommentsSetting|HoldAll|CommentPolicy|CommentOption|Publish|Visibility)' | sort -u | head -250
          echo "=== STRINGS ==="
          ls -d "$APP"/*.bundle | sed 's|.*/||' | tr '\n' ' '; echo
          find "$APP" -path '*en.lproj*' -name '*.strings' | while read f; do
            b=$(basename "$(dirname "$(dirname "$f")")")/$(basename "$f")
            plutil -convert xml1 -o - "$f" 2>/dev/null | python3 -c '
          import sys, re
          b = sys.argv[1]
          txt = sys.stdin.read()
          pairs = re.findall(r"<key>(.*?)</key>\s*<string>(.*?)</string>", txt, re.S)
          pat = re.compile(r"hold all|hold potentially|moderation|strictness|comments? (on|off|setting)|allow comments|save to camera roll|ultra.?wide|stabiliz|fps|frame rate|align|0\.5|record|segment|undo|ghost", re.I)
          for k, v in pairs:
              if pat.search(k) or pat.search(v):
                  print(b + ": " + k + " = " + v.replace("\n", " ")[:160])
          ' "$b"
          done | head -400
          echo "=== END ==="

      - name: Inject
        id: inject
        run: |
          mkdir deb-root
          dpkg-deb -x packages/*.deb deb-root
          export LDID="$(brew --prefix)/bin/ldid"
          tweak_version="$(awk '/^Version:/ {print $2}' control)"
          youtube_version="$(python3 - <<'PY'
          import plistlib
          import zipfile

          with zipfile.ZipFile('YouTube.ipa') as archive:
              info = next(name for name in archive.namelist()
                          if name.startswith('Payload/') and name.endswith('.app/Info.plist'))
              print(plistlib.loads(archive.read(info))['CFBundleShortVersionString'])
          PY
          )"
          if [ "${{ matrix.target.label }}" = "ios16" ]; then
            output="YTzoom_${tweak_version}_YouTube_iOS16_${youtube_version}.ipa"
          else
            output="YTzoom_${tweak_version}_YouTube_${youtube_version}.ipa"
          fi
          bash Scripts/sideload-repack.sh YouTube.ipa deb-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTzoom.dylib "$output"
          bash Tools/verify-artifacts.sh deb-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTzoom.dylib "$output"
          echo "ipa=$output" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: YTzoom-IPA-${{ matrix.target.label }}
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error
